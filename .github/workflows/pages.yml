# The site of this repository, published by GitHub Pages as the families publish theirs (Tewf/ai-augmented-agents):
# Quarto at a pinned version, the standard's stylesheet at the commit the checks pin, the concept's pages rendered,
# the checks and the sandbox left out; on push to main.
name: pages
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26
      - name: Clone the standard at its pinned commit
        run: |
          git clone --quiet https://github.com/Tewf/reader-ergonomics "$RUNNER_TEMP/reader-ergonomics"
          git -C "$RUNNER_TEMP/reader-ergonomics" checkout --quiet 65e42472e2d4cbfd994c2a86e95a47e5dc7301ca
          mkdir -p _standard
          cp "$RUNNER_TEMP/reader-ergonomics/site.css" _standard/site.css
      - name: Render the site
        run: quarto render
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
